openapi: 3.1.0
info:
  title: User Service API
  description: Сервис по управлению пассажирами и водителями.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: локальный сервер
paths:
  /passengers:
    post:
      tags:
        - Пассажиры
      summary: Зарегистрировать пассажира в системе.
      operationId: createPassenger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassengerRequest'
      responses:
        201:
          description: Пользователь успешно создан.
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: integer
                    format: int64
                    description: Уникальный идентификатор созданного пассажира.
        400:
          description: Некорректные значения параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /passengers/{passengerId}:
    get:
      tags:
        - Пассажиры
      summary: Получить информацию о пассажире по уникальному идентификатору.
      operationId: getPassenger
      parameters:
        - name: passengerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Уникальный идентификатор пользователя.
      responses:
        200:
          description: Информация успешно найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassengerResponse'
        400:
          description: Некорректные значения параметров.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Информация не найдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    PassengerResponse:
      type: object
      description: Информация о пассажире.
      properties:
        id:
          type: integer
          format: int64
          description: Уникальный идентификатор пассажира.
        name:
          type: string
          description: ФИО пассажира.
        email:
          type: string
          description: Электронная почта пассажира.
        phone:
          type: string
          description: Номер телефона пассажира.

    PassengerRequest:
      type: object
      required: [name, phone]
      description: Данные о пассажире для регистрации.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: ФИО пассажира.
        email:
          type: string
          minLength: 1
          maxLength: 255
          description: Электронная почта пассажира.
        phone:
          type: string
          minLength: 1
          maxLength: 20
          description: Номер телефона пассажира.

    Error:
      type: object
      description: Сущность с описанием ошибки.
      properties:
        code:
          type: integer
          format: int32
          description: Код ошибки.
        message:
          type: string
          description: Информация об ошибке.
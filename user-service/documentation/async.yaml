asyncapi: 3.0.0
info:
  title: Kafka User Service
  description: Протокол сообщений для Kafka в User Service.
  version: 1.0.0
servers:
  kafkaDevelop:
    host: localhost:9092
    description: стенд для разработки.
    protocol: kafka
channels:
  driver-assigned-events:
    title: driver-assigned-events
    address: driver-assigned-events
    description: Топик для отправки информации о назначении водителя на поездку.
    messages:
      DriverAssignedEvent:
        $ref: '#/components/messages/DriverAssignedEvent'
    servers:
      - $ref: '#/servers/kafkaDevelop'
  trip-created-events:
    title: trip-created-events
    address: trip-created-events
    description: Топик для чтения информации о создании заявки на поездку.
    messages:
      TripCreatedEvent:
        $ref: '#/components/messages/TripCreatedEvent'
    servers:
      - $ref: '#/servers/kafkaDevelop'
operations:
  sendDriverAssigned:
    action: send
    channel:
      $ref: '#/channels/driver-assigned-events'
    summary: Отправка уведомления о том, что водитель назначен на поездку.
  receiveTripCreated:
    action: receive
    channel:
      $ref: '#/channels/trip-created-events'
    summary: Получить уведомление о том, что заявка на поездку создана.
components:
  messages:
    DriverAssignedEvent:
      name: DriverAssignedEvent
      description: Информация по назначенному водителю.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DriverAssignedEvent'
    TripCreatedEvent:
      name: TripCreatedEvent
      description: Информация по заявке на поездку.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TripCreatedEvent'
  schemas:
    DriverAssignedEvent:
      type: object
      description: DTO для отправки информации по назначенному водителю.
      properties:
        eventId:
          type: string
          format: uuid
          description: Уникальный идентификатор события.
        timestamp:
          type: string
          format: date-time
          description: Время создания события.
        driverId:
          type: integer
          format: int64
          description: Уникальный идентификатор водителя.
        tripId:
          type: integer
          format: int64
          description: Уникальный идентификатор поездки.
    TripCreatedEvent:
      type: object
      description: DTO для получения информации по созданной заявке на поездку.
      properties:
        eventId:
          type: string
          format: uuid
          description: Уникальный идентификатор события.
        timestamp:
          type: string
          format: date-time
          description: Время создания события.
        tripId:
          type: integer
          format: int64
          description: Уникальный идентификатор поездки.
        passengerId:
          type: integer
          format: int64
          description: Уникальный идентификатор водителя.
        origin:
          type: string
          maxLength: 255
          description: Адрес отправления.
        destination:
          type: string
          maxLength: 255
          description: Адрес назначения.
        price:
          type: integer
          format: int64
          description: Стоимость поездки в копейках.
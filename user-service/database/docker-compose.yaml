name: user-service-db

services:
  postgres:
    container_name: users-db
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: user_service
      POSTGRES_USER: user_service
      POSTGRES_DB: user_service
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user_service -d user_service" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - user-service-local

  flyway:
    container_name: users-flyway
    image: flyway/flyway:12
    command: [ "-connectRetries=60", "migrate" ]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/user_service
      FLYWAY_USER: user_service
      FLYWAY_PASSWORD: user_service
      FLYWAY_SCHEMAS: user_service
      FLYWAY_LOCATION: filesystem:/flyway/sql/main
    volumes:
      - ./migrations:/flyway/sql/main
    depends_on:
      - postgres
    networks:
      - user-service-local

  redis:
    container_name: user-redis
    image: redis:8.6
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - user-service-local

  kafka:
    container_name: user-kafka
    image: apache/kafka:4.2.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - user-service-local

networks:
  user-service-local: